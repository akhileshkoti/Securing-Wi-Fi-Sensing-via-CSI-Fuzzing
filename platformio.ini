; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]                          ; shared by all boards
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11


[env:board_a]
upload_port = COM5
monitor_port = COM5

[env:board_b]
upload_port = COM7
monitor_port = COM7

[env:board_c]
upload_port = COM14
monitor_port = COM14

[env:board_d]
upload_port = COM16
monitor_port = COM16

; board_e: whichever board you flash with role=Guardian (e.g. the N16R8).
; Guardian is a role selected in the captive portal like Illuminator/Receiver
; -- same firmware as every other env, just a different board_build for the
; N16R8's flash/PSRAM. Fill in once confirmed (see include/GuardianSettings.h
; for the PRNG seed/schedule tunables).
[env:board_e]
upload_port = COM18
monitor_port = COM18