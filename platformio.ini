; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]                          ; shared by all boards
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
; guardian_main.cpp is a separate entry point (see [env:guardian]) and must
; never be compiled alongside src/main.cpp -- both define setup()/loop().
build_src_filter =
    +<*>
    -<guardian_main.cpp>


[env:board_a]
upload_port = COM9
monitor_port = COM9

[env:board_b]
upload_port = COM7
monitor_port = COM7

[env:board_c]
upload_port = COM14
monitor_port = COM14

; Guardian prototype (CSI-fuzzing defense, Objective 3) -- isolated from the
; Illuminator/Receiver/Controller pipeline the other envs build. Set
; upload_port/monitor_port to whichever board you're flashing this onto,
; and edit include/GuardianSettings.h before building.
[env:guardian]
build_src_filter =
    +<*>
    -<main.cpp>
upload_port = COM_SET_ME
monitor_port = COM_SET_ME